# ── pb3.avaflow.xyz — Pocket Broker v3 (Django 6.1 + gunicorn, Vue 3 SPA) ─────
# Successor to varna-market, running SIDE BY SIDE with it, not replacing it.
# The repo keeps a copy of this block at projects/pocket-broker-v3/deploy/nginx-pb3.conf.
#
#   app    : PM2 `pb3` -> gunicorn config.wsgi on 127.0.0.1:8501
#   static : /var/www/pb3/static        (rsynced by deploy.sh)
#   photos : /var/www/pb3/media/images  (the repo's data/images symlinks here),
#            falling back to varna's 762MB corpus — see the location below.
#   db     : pocket_broker_v3_phase1 — the isolated copy, NOT live varna_market.
#
# ⚠️ Must NOT carry `default_server` — 80 and 443 already have their catch-alls.
server {

    listen 80;
    listen [::]:80;

    server_name pb3.avaflow.xyz;

    # Django's collected static: its own admin CSS plus the built Vue bundle,
    # which vite.config.js pins to base:'/static/'.
    location /static/assets/ {
        alias /var/www/pb3/static/assets/;
        access_log off;
        # Vite content-hashes every filename in here, so a cached copy can
        # never be the wrong one.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /static/ {
        alias /var/www/pb3/static/;
        access_log off;
        expires 1h;
    }

    # Crawled photos. `local_path` is stored relative to MEDIA_ROOT (= data/)
    # and always begins `images/`, so this prefix covers every media URL the
    # API emits.
    #
    # Two trees, in this order, because v3's database is a RESTORED COPY of
    # varna's: every OfferImage row it inherited names a file that only exists
    # under /var/www/varna. Serving v3's own tree first and falling back to
    # varna's means the inherited 762MB corpus displays, while anything a v3
    # crawl downloads lands in v3's own tree and CANNOT overwrite a live photo.
    location /media/images/ {
        alias /var/www/pb3/media/images/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri @inherited_images;
    }
    location @inherited_images {
        # root, not alias: /media/images/x.jpg -> /var/www/varna/media/images/x.jpg
        root /var/www/varna;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }
    # Everything else under data/ — raw page snapshots, run logs, recon output —
    # is saved copies of other people's websites. It is not reachable from here
    # anyway (it stays inside drwxr-x--- /home/mvp), and this makes that explicit.
    location /media/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # settings.py reads this to know the request arrived over TLS
        # (DJANGO_BEHIND_PROXY=True). Set here, so a client cannot forge it.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Admin uploads and the odd large POST; the public API is read-only.
    client_max_body_size 8m;
}
